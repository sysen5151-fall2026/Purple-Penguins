openapi: 3.1.0
info:
  title: Recipe Roulette API
  version: 1.0.0
  description: >-
    Recipe generation defaults to deterministic local recipes and can be
    configured to use OpenAI. Grocery pricing remains deterministic in every
    mode. Ingredient ownership affects estimated additional purchase cost;
    this is not live grocery pricing or a production recommendation.
paths:
  /api/v1/recipes:
    post:
      operationId: generateRecipes
      summary: Generate recipe recommendations and estimated pricing
      description: >-
        Accepts ingredients the user already owns, a budget, and dietary
        restrictions; returns recipes from the configured generation mode and
        deterministic pricing data with ownership-aware additional purchase costs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecipeGenerationRequest"
      responses:
        "200":
          description: >-
            Recipe recommendations with deterministic estimated ingredient
            prices and totals. Response fields are unchanged across generation modes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeGenerationResponse"
        "400":
          description: The request body is malformed or contains invalid fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "500":
          description: Recipe generation or pricing failed unexpectedly.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackendFailure"
        "502":
          description: The configured upstream recipe provider returned unusable data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackendFailure"
        "503":
          description: Live recipe generation is not configured or is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackendFailure"

components:
  schemas:
    RecipeGenerationRequest:
      type: object
      additionalProperties: false
      required:
        - ingredients
        - budget
        - dietary_restrictions
      properties:
        ingredients:
          type: array
          description: >-
            Ingredients the user already owns. The backend uses case-insensitive
            exact-name matching after trimming surrounding whitespace and assumes
            the user has enough of each listed ingredient.
          minItems: 1
          items:
            type: string
            minLength: 1
        budget:
          type: number
          exclusiveMinimum: 0
          description: User's monetary budget in USD.
        dietary_restrictions:
          type: array
          description: Dietary restrictions supplied for this recipe request; an empty list means none.
          items:
            type: string
            minLength: 1
      description: >-
        Servings are omitted because they are not currently supported by the
        backend and are not confirmed as an Innoslate requirement.

    RecipeGenerationResponse:
      type: object
      additionalProperties: false
      required:
        - recipes
      properties:
        recipes:
          type: array
          items:
            $ref: "#/components/schemas/RecipeResult"

    RecipeResult:
      type: object
      additionalProperties: false
      required:
        - name
        - ingredients
        - estimated_total_cost
        - additional_purchase_cost
        - within_budget
      properties:
        name:
          type: string
          minLength: 1
        ingredients:
          type: array
          description: Ingredient names and their estimated prices from the local pricing stub.
          items:
            $ref: "#/components/schemas/PricedIngredient"
        estimated_total_cost:
          type: number
          minimum: 0
          description: >-
            Full recipe cost: sum of all estimated ingredient prices, whether
            or not the user already owns those ingredients, in USD.
        additional_purchase_cost:
          type: number
          minimum: 0
          description: >-
            Sum of estimated prices for ingredients the user does not already
            own, in USD.
        within_budget:
          type: boolean
          description: Whether additional_purchase_cost is less than or equal to the submitted budget.

    PricedIngredient:
      type: object
      additionalProperties: false
      required:
        - name
        - estimated_price
        - owned
      properties:
        name:
          type: string
          minLength: 1
        estimated_price:
          type: number
          minimum: 0
          description: Estimated price in USD from the deterministic grocery-store stub.
        owned:
          type: boolean
          description: Whether the ingredient exactly matches a user-owned ingredient after case and whitespace normalization.

    ValidationError:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
          properties:
            code:
              type: string
              const: invalid_request
            message:
              type: string
            field_errors:
              type: object
              description: Optional mapping from request field names to validation messages.
              additionalProperties:
                type: string

    BackendFailure:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
          properties:
            code:
              type: string
              const: backend_failure
            message:
              type: string
              description: Safe user-facing message; internal exception details must not be returned.
